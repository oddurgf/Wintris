name: Probe games max (one-off)

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Scoring period to look at"
        default: "1"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for the games max in Fantrax responses
        env:
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}
        run: python3 -I scripts/probe_games_max.py "${{ inputs.week }}"
