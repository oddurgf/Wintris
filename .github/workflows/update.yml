name: Update league data

on:
  schedule:
    # Times are UTC, which is the same as Iceland time.
    # GitHub often starts scheduled runs hours late (and skips busy on-the-hour slots),
    # so each day has an early run off the hour plus two backups. A run with nothing new is harmless.
    - cron: "7 9 * * 1"     # Monday 09:07, after the week's last games on Sunday night (END_GRACE counts it finished from 09:00)
    - cron: "37 11 * * 1"   # Monday backup
    - cron: "37 15 * * 1"   # Monday second backup
    - cron: "7 9 * * 4"     # Thursday 09:07, picks up Fantrax's stat corrections
    - cron: "37 11 * * 4"   # Thursday backup
    - cron: "37 15 * * 4"   # Thursday second backup
  workflow_dispatch:        # "Run workflow" button for a manual update
  push:
    branches: [main]        # republish when you change the site yourself

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wintris-pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch finished weeks from Fantrax
        env:
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}
        run: python3 -I scripts/fetch_weeks.py data/weekly_stats.json

      - name: Fetch team logos from Fantrax
        continue-on-error: true   # logos are nice to have; never block the stats update
        env:
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}
        run: python3 -I scripts/fetch_logos.py data/logos.json

      - name: Build data.js
        run: python3 -I scripts/build_data.py

      - name: Save new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly_stats.json data/logos.json data/periods.json data/gp_limits.json data/update_status.json data.js
          if git diff --cached --quiet; then
            echo "No new numbers this time."
          else
            git commit -m "Update league data $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html data.js _site/
          # a new data.js address on every deploy, so no browser keeps showing old numbers
          sed -i 's|src="data.js"|src="data.js?v=${{ github.run_id }}-${{ github.run_attempt }}"|' _site/index.html
          grep -q 'data.js?v=' _site/index.html
          cp -r img _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
