name: Probe shot attempts (one-off)
on:
  push:
    branches: [probe-shots]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}
        run: python3 -I probe/probe_shots.py
